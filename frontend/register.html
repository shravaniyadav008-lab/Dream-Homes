<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Dream Homes</title>

    <style>
        /* ======================
   GLOBAL
====================== */
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            display: flex;
            flex-direction: column;
            height: 100vh;
            line-height: 1.6;
        }
        /* ======================
   HEADER
====================== */
        
        header {
            background: #2c3e50;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        header a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }
        
        nav a.active {
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }
        /* NAV BUTTONS */
        
        .nav-btn {
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .login-btn {
            background: #fff;
            color: #333;
            border: 1px solid #333;
        }
        
        .login-btn:hover {
            background: #333;
            color: #fff;
        }
        
        .register-btn {
            background: #ff9800;
            color: #fff;
        }
        
        .register-btn:hover {
            background: #e68900;
        }
        /* ======================
   MAIN CONTAINER
====================== */
        
        .main {
            flex: 1;
            display: flex;
        }
        /* ===== LEFT PANEL ===== */
        
        .left-panel {
            width: 50%;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }
        
        .left-panel h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }
        
        .left-panel p {
            max-width: 400px;
        }
        /* ===== RIGHT PANEL ===== */
        
        .right-panel {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* ===== REGISTER CARD ===== */
        
        .register-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 40px;
            width: 380px;
            color: #fff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        
        .register-card h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        /* FLOATING INPUT */
        
        .input-box {
            position: relative;
            margin-bottom: 25px;
        }
        
        .input-box input {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: none;
            border-bottom: 2px solid #fff;
            color: #fff;
            outline: none;
        }
        
        .input-box label {
            position: absolute;
            top: 12px;
            left: 0;
            color: #ccc;
            transition: 0.3s;
        }
        
        .input-box input:focus+label,
        .input-box input:valid+label {
            top: -10px;
            font-size: 12px;
            color: #00c6ff;
        }
        /* SHOW PASSWORD */
        
        .show-pass {
            position: absolute;
            right: 0;
            top: 12px;
            cursor: pointer;
            font-size: 12px;
            color: #ccc;
        }
        /* BUTTON */
        
        .form-btn {
            width: 100%;
            padding: 12px;
            background: #00c6ff;
            border: none;
            border-radius: 30px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .form-btn:hover {
            background: #00c6ff;
        }
        /* LOGIN LINK */
        
        .extra {
            text-align: center;
            margin-top: 15px;
        }
        
        .extra a {
            color: #00c6ff;
            text-decoration: none;
        }
        /* RESPONSIVE */
        
        @media(max-width:900px) {
            .main {
                flex-direction: column;
            }
            .left-panel,
            .right-panel {
                width: 100%;
                height: 50%;
            }
        }
    </style>
</head>

<body>

    <header>
        <h2>Dream Homes</h2>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="Properties.html">Properties</a>
            <a href="About.html">About</a>
            <a href="Contact.html">Contact</a>
            <a href="admin.html" class="active">Admin</a>
            <a href="wishlist.html">❤️</a>
            <a href="login.html" class="nav-btn login-btn">Login</a>
            <a href="register.html" class="nav-btn register-btn">Register</a>
        </nav>
    </header>

    <div class="main">

        <div class="left-panel">
            <h1>Join Dream Homes</h1>
            <p>Create your account today and explore premium real estate opportunities.</p>
        </div>

        <div class="right-panel">
            <form class="register-card" id="registerForm">
                <h2>Create Account</h2>

                <div class="input-box">
                    <input type="text" name="name" required>
                    <label>Full Name</label>
                </div>

                <div class="input-box">
                    <input type="email" name="email" required>
                    <label>Email</label>
                </div>

                <div class="input-box">
                    <input type="password" id="password" name="password" required>
                    <label>Password</label>
                    <span class="show-pass" onclick="togglePass('password')">Show</span>
                </div>
                <div class="input-box">
                    <input type="password" id="confirm" name="confirmPassword" required>
                    <label for="confirm">Confirm Password</label>
                    <span class="show-pass" onclick="togglePass('confirm')">Show</span>
                </div>

                <button type="submit" class="form-btn">Register</button>

                <div class="extra">
                    Already have an account? <a href="login.html">Login</a>
                </div>
            </form>
        </div>

    </div>

    <script>
        function togglePass(id) {
            var input = document.getElementById(id);
            input.type = input.type === "password" ? "text" : "password";
        }
    </script>
    <script src="js/script.js"></script>
</body>

</html>
